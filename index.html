<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem e-NILAM Interaktif</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased">

  <!-- ================= LOG IN PORTAL ================= -->
  <div id="portalContainer" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 relative z-10">
    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-6 sm:p-8 max-w-md w-full border border-white/20 relative z-20">
      
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-blue-600 text-amber-400 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-lg mb-3">
          <i class="fa-solid fa-book-open"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-blue-950">e-NILAM Interaktif</h1>
        <p class="text-xs text-slate-500 mt-1">Sistem Rekod & Analisis Bacaan Digital</p>
      </div>

      <!-- TOGGLE ROLE BUTTONS (DIBAIKI DENGAN CURSOR-POINTER & Z-INDEX) -->
      <div class="flex rounded-xl bg-slate-100 p-1 mb-6 border border-slate-200 relative z-30">
        <button type="button" onclick="switchRole('student')" id="roleBtnStudent" class="flex-1 py-2 text-sm font-bold rounded-lg bg-blue-600 text-white shadow-sm transition cursor-pointer relative z-30">
          <i class="fa-solid fa-user-graduate mr-1"></i> Pelajar
        </button>
        <button type="button" onclick="switchRole('admin')" id="roleBtnAdmin" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-600 hover:text-blue-600 transition cursor-pointer relative z-30">
          <i class="fa-solid fa-user-shield mr-1"></i> Pentadbir
        </button>
      </div>

      <!-- FORM LOGIN PELAJAR -->
      <form id="studentLoginForm" onsubmit="handleStudentLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">ID Pelajar</label>
          <input type="text" id="inputStudentId" required placeholder="Contoh: KV001" class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none uppercase text-sm font-semibold">
          <p class="text-[11px] text-slate-400 mt-1">ID sedia ada: <span class="text-blue-700 font-bold">KV001, KV002, KV003, KV004</span></p>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2 cursor-pointer">
          <span>Log Masuk Pelajar</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- FORM LOGIN ADMIN -->
      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Kata Laluan Pentadbir</label>
          <input type="password" id="inputAdminPassword" required placeholder="Masukkan Kata Laluan" class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
          <p class="text-[11px] text-slate-400 mt-1">Kata laluan: <code class="bg-slate-100 px-1.5 py-0.5 rounded text-blue-700 font-bold">admin123</code></p>
        </div>
        <button type="submit" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2 cursor-pointer">
          <span>Log Masuk Admin</span>
          <i class="fa-solid fa-lock text-xs"></i>
        </button>
      </form>

    </div>
  </div>

  <script>

      const btnStudent = document.getElementById('roleBtnStudent');
      const btnAdmin = document.getElementById('roleBtnAdmin');
      const formStudent = document.getElementById('studentLoginForm');
      const formAdmin = document.getElementById('adminLoginForm');

      if (role === 'admin') {
        btnAdmin.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-indigo-700 text-white shadow-sm transition cursor-pointer relative z-30";
        btnStudent.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-600 hover:text-blue-600 transition cursor-pointer relative z
