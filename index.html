<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem e-NILAM Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- NAVIGATION -->
  <nav class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-book-bookmark text-yellow-400 text-2xl"></i>
        <h1 class="font-bold text-xl tracking-wide">e-NILAM</h1>
      </div>
      <div id="userInfo" class="text-sm font-medium bg-indigo-800 px-3 py-1 rounded-full hidden">
        <span id="displayUser"></span>
      </div>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto p-4 sm:p-6">

    <!-- LOGIN SCREEN -->
    <div id="pageLogin" class="bg-white rounded-xl shadow-md p-6 max-w-md mx-auto my-12">
      <h2 class="text-2xl font-bold text-center text-indigo-700 mb-6">Log Masuk Pelajar</h2>
      
      <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ID Pelajar</label>
          <input type="text" id="loginId" required placeholder="Contoh: KV001" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none uppercase">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Pelajar</label>
          <input type="text" id="loginName" required placeholder="Masukkan Nama Anda" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
          <!-- PILIHAN KELAS YANG TELAH DIPERBARUI -->
          <select id="loginClass" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="">-- Pilih Kelas --</option>
            <option value="Computer System">Computer System</option>
            <option value="Perladangan">Perladangan</option>
            <option value="Elektrik">Elektrik</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">
          Masuk Sistem
        </button>
      </form>
    </div>

    <!-- MAIN FORM SCREEN (Page 2: Rekod Bacaan Baharu) -->
    <div id="pageForm" class="hidden bg-white rounded-xl shadow-md p-6">
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">Borang Rekod Bacaan Baharu</h2>
          <p class="text-sm text-gray-500">Isi borang di bawah untuk menghantar laporan Nilam anda.</p>
        </div>
        <button onclick="handleLogout()" class="text-sm bg-red-100 text-red-600 hover:bg-red-200 px-3 py-1 rounded-lg">
          Log Keluar
        </button>
      </div>

      <!-- FORM INTEGRATED WITH WEB3FORMS -->
      <form action="https://api.web3forms.com/submit" method="POST" id="nilamForm" onsubmit="handleSubmitNotice(event)" class="space-y-4">

        <!-- Access Key daripada Web3Forms -->
        <input type="hidden" name="access_key" value="a9f22977-e888-45ff-a45f-0a8865c4238c">
        
        <!-- Tajuk Subjek Emel yang Diterima Pentadbir -->
        <input type="hidden" name="subject" value="Rekod e-NILAM Baharu Pelajar">
        <input type="hidden" name="from_name" value="Sistem e-NILAM Web">

        <!-- Hidden inputs untuk maklumat pelajar -->
        <input type="hidden" id="student_id" name="ID_Pelajar">
        <input type="hidden" id="student_name" name="Nama_Pelajar">
        <input type="hidden" id="student_class" name="Kelas_Pelajar">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tajuk Buku</label>
            <input type="text" name="Tajuk_Buku" required placeholder="Contoh: Asas Pengaturcaraan C++" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kategori Khas Buku</label>
            <select name="Kategori_Khas" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="">-- Pilih Kategori --</option>
              <option value="Computer System">Computer System</option>
              <option value="Perladangan">Perladangan</option>
              <option value="Elektrik">Elektrik</option>
              <option value="Umum">Umum / Lain-lain</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Bahasa</label>
            <select name="Bahasa" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="Bahasa Melayu">Bahasa Melayu</option>
              <option value="Bahasa Inggeris">Bahasa Inggeris</option>
              <option value="Lain-lain">Lain-lain</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Jumlah Muka Surat</label>
            <input type="number" name="Muka_Surat" min="1" required placeholder="Contoh: 120" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Pengarang</label>
          <input type="text" name="Nama_Pengarang" required placeholder="Contoh: Dr. Ahmad Razali" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Rumusan / Pengajaran</label>
          <textarea name="Rumusan_Pengajaran" rows="4" required placeholder="Tuliskan ringkasan atau nilai murni yang didapati dari buku ini..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-md transition flex items-center justify-center space-x-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Hantar Rekod Bacaan</span>
        </button>
      </form>
    </div>

    <!-- SUCCESS MESSAGE -->
    <div id="pageSuccess" class="hidden bg-white rounded-xl shadow-md p-8 text-center max-w-md mx-auto">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
        <i class="fa-solid fa-check"></i>
      </div>
      <h3 class="text-2xl font-bold text-gray-800 mb-2">Berjaya Dihantar!</h3>
      <p class="text-gray-600 mb-6">Rekod bacaan e-NILAM anda telah disahkan dan dihantar ke pentadbir.</p>
      <button onclick="resetForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2 rounded-lg">
        Tambah Rekod Baharu
      </button>
    </div>

  </div>

  <script>
    let currentUser = null;

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const name = document.getElementById('loginName').value.trim();
      const studentClass = document.getElementById('loginClass').value;

      currentUser = { id, name, studentClass };

      // Set hidden input fields
      document.getElementById('student_id').value = id;
      document.getElementById('student_name').value = name;
      document.getElementById('student_class').value = studentClass;

      // Update UI Navigation
      document.getElementById('displayUser').innerText = `${id} - ${name} (${studentClass})`;
      document.getElementById('userInfo').classList.remove('hidden');

      // Show Form Page
      document.getElementById('pageLogin').classList.add('hidden');
      document.getElementById('pageForm').classList.remove('hidden');
    }

    function handleLogout() {
      currentUser = null;
      document.getElementById('userInfo').classList.add('hidden');
      document.getElementById('pageForm').classList.add('hidden');
      document.getElementById('pageSuccess').classList.add('hidden');
      document.getElementById('pageLogin').classList.remove('hidden');
      document.getElementById('formLogin').reset();
    }

    function handleSubmitNotice(e) {
      setTimeout(() => {
        document.getElementById('pageForm').classList.add('hidden');
        document.getElementById('pageSuccess').classList.remove('hidden');
      }, 500);
    }

    function resetForm() {
      document.getElementById('nilamForm').reset();
      if(currentUser) {
        document.getElementById('student_id').value = currentUser.id;
        document.getElementById('student_name').value = currentUser.name;
        document.getElementById('student_class').value = currentUser.studentClass;
      }
      document.getElementById('pageSuccess').classList.add('hidden');
      document.getElementById('pageForm').classList.remove('hidden');
    }
  </script>
</body>
</html>
