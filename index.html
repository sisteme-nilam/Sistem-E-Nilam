<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem E-NILAM Sekolah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- PWA Manifest Dynamic Generation -->
    <script>
        const manifestData = {
            "name": "E-NILAM Sekolah",
            "short_name": "E-NILAM",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#4f46e5",
            "icons": [{
                "src": "https://cdn-icons-png.flaticon.com/512/2232/2232688.png",
                "sizes": "512x512",
                "type": "image/png"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>
    <meta name="theme-color" content="#4f46e5">
</head>
<body class="bg-slate-900 font-sans text-slate-800 antialiased min-h-screen flex justify-center items-center p-0 md:p-4">

    <!-- App Shell Container -->
    <div class="w-full md:max-w-md bg-slate-100 min-h-screen md:min-h-[844px] md:h-[844px] md:rounded-3xl shadow-2xl flex flex-col relative overflow-hidden border-0 md:border-4 border-slate-700">
        
        <!-- PWA Install Banner -->
        <div id="pwaInstallBanner" class="hidden bg-gradient-to-r from-amber-500 to-indigo-600 text-white p-3 flex justify-between items-center text-xs shadow-md">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-mobile-screen text-base"></i>
                <span>Pasang Aplikasi E-NILAM pada telefon anda!</span>
            </div>
            <button onclick="installPWA()" class="bg-white text-indigo-900 font-bold px-3 py-1 rounded-full shadow hover:bg-slate-100 transition">
                Pasang
            </button>
        </div>

        <!-- Top Header Bar -->
        <header class="bg-indigo-700 text-white px-4 py-3 flex justify-between items-center shadow-md shrink-0">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-yellow-400 text-indigo-900 rounded-lg flex items-center justify-center font-black text-base shadow-sm">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base leading-tight tracking-wide">E-NILAM</h1>
                    <p class="text-[10px] text-indigo-200">Sistem Bacaan Digital Sekolah</p>
                </div>
            </div>
            <div id="userInfoHeader" class="hidden flex items-center space-x-2">
                <span id="roleBadge" class="bg-indigo-900 text-yellow-300 text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-indigo-500"></span>
                <button onclick="logout()" title="Log Keluar" class="w-7 h-7 bg-red-500/80 hover:bg-red-600 text-white rounded-full flex items-center justify-center text-xs transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- Main Scrollable Content Container -->
        <main id="mainContainer" class="flex-grow overflow-y-auto p-4 space-y-4 pb-20">

            <!-- SCREEN: LOG MASUK -->
            <div id="loginScreen" class="py-6 space-y-6">
                <div class="text-center space-y-2">
                    <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                        <i class="fa-solid fa-graduation-cap text-3xl"></i>
                    </div>
                    <h2 class="text-xl font-extrabold text-slate-800">Selamat Datang</h2>
                    <p class="text-xs text-slate-500">Sila masukkan maklumat log masuk anda</p>
                </div>

                <!-- Tab Swapper -->
                <div class="flex bg-slate-200 p-1 rounded-xl">
                    <button type="button" onclick="switchLoginTab('student')" id="tabStudent" class="w-1/2 py-2 text-xs font-bold rounded-lg transition bg-white text-indigo-700 shadow-sm">Pelajar</button>
                    <button type="button" onclick="switchLoginTab('admin')" id="tabAdmin" class="w-1/2 py-2 text-xs font-bold rounded-lg transition text-slate-500">Admin / GPM</button>
                </div>

                <!-- Student Login Form -->
                <form id="studentLoginForm" onsubmit="handleStudentLogin(event)" class="space-y-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">ID Pelajar / ID NILAM</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-id-card"></i>
                            </span>
                            <input type="text" id="inputStudentId" required placeholder="Masukkan ID Pelajar" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-200 flex items-center justify-center space-x-2">
                        <span>Masuk Sebagai Pelajar</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>

                <!-- Admin Login Form -->
                <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="hidden space-y-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Kata Laluan Pentadbir</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="inputAdminPass" required placeholder="Masukkan kata laluan admin" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 active:scale-95 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg flex items-center justify-center space-x-2">
                        <span>Masuk Mod Admin</span>
                        <i class="fa-solid fa-user-shield text-xs"></i>
                    </button>
                </form>
            </div>

            <!-- APP CONTENT CONTAINER -->
            <div id="appContent" class="hidden space-y-4">
                
                <!-- PAGE 1: DASHBOARD / LAMAN UTAMA -->
                <div id="page1" class="space-y-4">
                    <div class="bg-gradient-to-r from-indigo-600 to-indigo-800 text-white p-4 rounded-2xl shadow-md space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 id="dashTitle" class="font-extrab
